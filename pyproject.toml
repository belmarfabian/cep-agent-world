[project]
name = "cep-agent-world"
version = "0.1.0"
description = "Mundo simulado de agentes basado en la Encuesta CEP Chile"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyreadstat>=1.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "mesa>=3.0",
    "networkx>=3.2",
    "anthropic>=0.50",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0"]
analysis = ["umap-learn>=0.5", "hdbscan>=0.8"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.3"]
